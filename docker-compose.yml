services:
  dell-infra-manager:
    image: dell-infra-manager:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dell-infra-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=Europe/Vienna
      # Optional: provide a pre-generated 32-byte key instead of auto-generated file
      # - MASTER_KEY=<base64-encoded-32-byte-key>
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
